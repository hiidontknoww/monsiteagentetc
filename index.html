<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)">
<meta name="msapplication-navbutton-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vladimir (@vladimirmoulu)</title>
<style>
  *{
    margin:0;padding:0;box-sizing:border-box;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  img{
    -webkit-user-drag:none;user-drag:none;
    pointer-events:none;
  }
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#fefefe}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#151515;
    font-synthesis:none;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    height:100vh;
    background:#fefefe;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:max(16px, calc(env(safe-area-inset-top) + 10px)) 16px;
    position:relative;
  }
  .wrap{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:transparent;
  }
  .pname{
    position:relative;
    z-index:2;
    margin-bottom:36px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .name{
    font-size:25px;
    font-weight:500;
    letter-spacing:-.65px;
    line-height:1.1;
    text-shadow:none;
  }
  .sub{
    margin-top:7px;
    font-size:8px;
    font-weight:550;
    letter-spacing:2.8px;
    text-transform:uppercase;
    color:#8b8b8f;
  }
  .ctext{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto;
    align-items:center;
    gap:12px;
    line-height:1.2;
    min-width:0;
  }
  .ctext .ctitle{
    font-size:12.75px;
    font-weight:540;
    letter-spacing:-.04px;
    color:#1b1b1d;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ctext .csub{
    font-size:8.5px;
    letter-spacing:.65px;
    text-transform:uppercase;
    font-weight:550;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#96969b;
    padding-left:12px;
    border-left:1px solid rgba(0,0,0,.07);
  }
  .links{
    width:100%;
    margin-top:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .card{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(0,0,0,.075);
    text-decoration:none;
    color:#111;
    font-size:14px;
    font-weight:450;
    letter-spacing:.2px;
    box-shadow:0 1px 0 rgba(0,0,0,.012);
    transition:background .22s ease, border-color .22s ease, box-shadow .22s ease, transform .22s ease;
  }
  .card:hover{background:#fff;border-color:rgba(0,0,0,.13);box-shadow:0 8px 28px rgba(0,0,0,.035);transform:translateY(-1px)}
  .card .ic{
    width:24px;
    height:24px;
    flex:0 0 24px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:transparent;
    border:none;
    color:#333336;
    transition:transform .22s cubic-bezier(.2,.7,.2,1),color .18s ease;
  }
  .card .ic svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.65}
  .card:hover .ic{transform:scale(1.035);color:#111}
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid rgba(0,0,0,.28);outline-offset:2px;border-color:transparent;background:rgba(0,0,0,.018)}

  @media (max-width:420px){
    .pname{margin-bottom:30px}
    .links{gap:8px}
    .card{padding:12px 13px;gap:9px}
    .ctext{gap:8px}
    .ctext .ctitle{font-size:12px}
    .ctext .csub{font-size:7.75px;letter-spacing:.45px;padding-left:8px}
    .card .ic{width:22px;height:22px;flex-basis:22px}
    .card .ic svg{width:16px;height:16px}
  }

  @keyframes riseIn{
    from{opacity:0;translate:0 10px;filter:blur(7px)}
    to  {opacity:1;translate:0 0;filter:blur(0)}
  }
  .name{animation:riseIn .75s .05s both cubic-bezier(.2,.7,.2,1)}
  .sub{animation:riseIn .75s .16s both cubic-bezier(.2,.7,.2,1)}
  .links .card{animation:riseIn .7s both cubic-bezier(.2,.7,.2,1)}
  .links .card:nth-child(1){animation-delay:.32s}
  .links .card:nth-child(2){animation-delay:.4s}
  .links .card:nth-child(3){animation-delay:.48s}
  .links .card:nth-child(4){animation-delay:.56s}
  .links .card:nth-child(5){animation-delay:.64s}
  .links .card:nth-child(6){animation-delay:.72s}
  .links .card:nth-child(7){animation-delay:.80s}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }

  /* =========================================================
     HIGH-DPI / 4K RENDERING POLISH
     Aucun changement de structure visible ou de contenu.
  ========================================================= */

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:geometricPrecision;
  }

  .wrap{
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }

  .name,
  .sub,
  .ctext .ctitle,
  .ctext .csub{
    text-rendering:geometricPrecision;
  }

  .card{
    isolation:isolate;
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    box-shadow:
      0 1px 0 rgba(0,0,0,.018),
      0 0 0 .35px rgba(255,255,255,.72) inset;
  }

  .card:hover{
    box-shadow:
      0 10px 30px rgba(0,0,0,.038),
      0 1px 0 rgba(255,255,255,.92) inset;
  }

  .card .ic{
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
  }

  .card .ic svg{
    shape-rendering:geometricPrecision;
    text-rendering:geometricPrecision;
    vector-effect:non-scaling-stroke;
    overflow:visible;
  }

  /* évite le léger flou de l'animation d'arrivée */
  @keyframes riseIn{
    from{
      opacity:0;
      translate:0 8px;
    }
    to{
      opacity:1;
      translate:0 0;
    }
  }

  @media (min-resolution:2dppx){
    .card{
      border-color:rgba(0,0,0,.08);
    }

    .ctext .csub{
      border-left-color:rgba(0,0,0,.075);
    }
  }

  @media (min-resolution:3dppx){
    .card{
      border-color:rgba(0,0,0,.085);
    }

    .card .ic svg{
      shape-rendering:geometricPrecision;
    }
  }


  /* =========================================================
     POLISH VISUEL — TYPOGRAPHIE / ESPACEMENTS / MICRO-INTERACTIONS
  ========================================================= */

  body{
    font-family:
      "SF Pro Display",
      "SF Pro Text",
      Inter,
      -apple-system,

  .card:hover{
    background:#fff;

    letter-spacing:-.11px;

  }

  @media (max-height:720px){

  /* =========================================================

  @media (max-width:420px) and (max-height:720px){

  @media (min-width:421px) and (max-width:680px){

  /* =========================================================
     MOBILE — ESPACEMENT PLUS LARGE ENTRE CHAQUE ONGLET
  ========================================================= */

  @media (max-width:420px){
    .links{
      gap:16px;
    }
  }

  @media (max-width:420px) and (max-height:720px){
    .links{
      gap:12px;
    }
  }

  @media (min-width:421px) and (max-width:680px){
    .links{
      gap:14px;
    }
  }


  /* =========================================================
     ESPACEMENT MOBILE — VERSION TRÈS AÉRÉE
  ========================================================= */

  @media (max-width:680px){
    .links{
      gap:24px !important;
    }
  }

  @media (max-width:420px){
    .links{
      gap:26px !important;
    }
  }

  /* On neutralise les règles précédentes qui réduisaient l'espace
     sur les écrans peu hauts. */
  @media (max-width:680px) and (max-height:720px){
    .links{
      gap:20px !important;
    }
  }

</style>

<script>
  ['contextmenu','dragstart','selectstart'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key||'').toLowerCase();
    if (k === 'f12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) !== -1) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && ['s','u','p','a'].indexOf(k) !== -1) { e.preventDefault(); }
