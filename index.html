<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Liens</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100%;
    background: #fafafa;
  }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    color: #151515;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
  }

  .wrap {
    width: min(100%, 500px);
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    padding: 13px 15px;
    border: 1px solid rgba(0, 0, 0, .08);
    border-radius: 13px;
    background: #fff;
    color: #151515;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .025);
  }

  .card:hover {
    border-color: rgba(0, 0, 0, .14);
    background: #fff;
  }

  .card:focus-visible {
    outline: 2px solid rgba(0, 0, 0, .3);
    outline-offset: 3px;
  }

  .ic {
    width: 25px;
    height: 25px;
    flex: 0 0 25px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #202225;
  }

  .ic svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .ctext {
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    line-height: 1.2;
  }

  .ctitle {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.1px;
  }

  .csub {
    min-width: 0;
    max-width: 190px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-left: 12px;
    border-left: 1px solid rgba(0, 0, 0, .08);
    color: #8b8d92;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .55px;
    text-transform: uppercase;
  }

  @media (max-width: 520px) {
    body {
      align-items: flex-start;
      padding: 28px 14px;
    }

    .links {
      gap: 10px;
    }

    .card {
      min-height: 54px;
      padding: 12px 13px;
      border-radius: 12px;
    }

    .ctext {
      gap: 9px;
    }

    .ctitle {
      font-size: 12px;
    }

    .csub {
      max-width: 150px;
      padding-left: 9px;
      font-size: 7px;
      letter-spacing: .4px;
    }
  }
</style>
</head>
